name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 编译并打包
        run: sh scripts/build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cns-openwrt
          path: dist/*

      - name: 发布 Release（打 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: 更新 latest Release（push / 手动运行）
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: 最近一次构建 ${{ github.sha }}
          make_latest: false
          files: dist/*
